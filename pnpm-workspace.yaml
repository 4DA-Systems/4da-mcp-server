# pnpm settings for @4da/mcp-server. A standalone project: `packages` is empty
# on purpose. Every pnpm setting lives here, not in package.json's `pnpm`
# field: pnpm 11 no longer reads that field and dropped all the security
# overrides (seen in CI's pnpm 11 audit step, issue #9). pnpm 10 reads both.
packages: []

# --- Supply-chain policy (same values as the 4DA app's pnpm-workspace.yaml) ---
minimumReleaseAge: 4320
minimumReleaseAgeExclude: []
trustPolicy: no-downgrade
# Exceptions: "package@version" with the reason in a comment.
trustPolicyExclude: []
strictDepBuilds: true

# Install scripts run only for these (strictDepBuilds fails on any other).
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild

# Security overrides. Each pins a transitive dependency past an advisory;
# drop one when every path to it already resolves past the floor.
#   source-map-js: GHSA-68fv-2mgg-jv7q (high, event-loop DoS) via vite > postcss (issue #9)
overrides:
  fast-uri: ">=3.1.5"
  ip-address: ">=10.3.1 <11"
  vite: ">=7.3.5 <8"
  esbuild: ">=0.28.1"
  hono: ">=4.12.34 <5"
  "@hono/node-server": ">=2.0.5 <3"
  "minimatch@>=9.0.0 <9.0.6": ">=9.0.7"
  "picomatch@>=4.0.0 <4.0.4": ">=4.0.4"
  "brace-expansion@<1.1.18": ">=1.1.18 <2"
  "brace-expansion@>=2.0.0 <2.0.3": ">=2.0.3"
  "brace-expansion@>=3.0.0 <5.0.9": ">=5.0.9 <6"
  "js-yaml@>=4.0.0 <4.3.1": ">=4.3.1 <5"
  "nanoid@<3.3.18": ">=3.3.18 <4"
  "nanoid@>=4.0.0 <5.1.16": ">=5.1.16 <6"
  "postcss@<8.5.23": ">=8.5.23 <9"
  "undici@>=7.0.0 <7.29.0": ">=7.29.0 <8"
  "source-map-js@<1.2.2": ">=1.2.2 <2"
