name: Feature request
description: Something your agent needed to know about a dependency and could not find out.
labels: ["enhancement"]
body:
  - type: textarea
    id: task
    attributes:
      label: The task
      description: What the agent was doing, and the question it could not answer.
    validations:
      required: true
  - type: textarea
    id: answer
    attributes:
      label: The answer you wanted
      description: What a good tool response would have contained, and where that information lives (registry, changelog, advisory database, your lockfile).
    validations:
      required: true
