# Dependabot for @4da/mcp-server.
#   - npm (/)            the package (pnpm-lock.yaml; the "npm" ecosystem reads pnpm lockfiles)
#   - github-actions (/) workflow action pins
# test-fixtures/ holds frozen fixture lockfiles on purpose and is not watched.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels:
      - "dependencies"
    assignees:
      - "runyourempire"
    commit-message:
      # "chore" + include: scope renders as chore(deps) / chore(deps-dev).
      prefix: "chore"
      include: "scope"
    ignore:
      # DEFERRED 2026-09-24 (4DA #446). better-sqlite3 13 ships no Windows
      # prebuild for the Node 22 ABI, so `npm install` falls back to node-gyp
      # and fails on any Windows machine without Visual Studio: every Windows
      # user of `npx @4da/mcp-server` on Node 22. (Its engines floor, Node 22,
      # already matches ours.) Lift this once a Node 22 win32 prebuild exists.
      - dependency-name: "better-sqlite3"
        versions: [">=13"]
      # DEFERRED 2026-11-25 (#51). pnpm-workspace.yaml caps vite below 8 with
      # an override (`vite: ">=7.3.5 <8"`), so a Dependabot major bump edits
      # package.json to "~8.x" while the lockfile, and every test, stay on
      # vite 7: #51 went green that way without ever installing vite 8. vite
      # is only the engine under vitest here and ships to nobody. Moving to 8
      # is one deliberate change (the devDependency AND the override together,
      # then the whole suite on the three platforms). Lift this when the 7.x
      # line stops receiving security releases or vitest drops support for it.
      - dependency-name: "vite"
        versions: [">=8"]
      # DEFERRED 2026-11-25 (#116). undici 8 needs Node 22.19 or later (its
      # "engines"); this package supports Node 22.0.0 and later (package.json)
      # and CI's oldest leg runs 22.12, where #116 failed with "Cannot read
      # properties of undefined (reading 'bind')" while every other leg
      # passed. undici is the server's HTTP client, pinned exactly. Lift this
      # when this package's engines floor reaches 22.19. 7.x releases
      # (engines: Node 20.18.1 or later) still arrive: this entry covers 8 and
      # later only.
      - dependency-name: "undici"
        versions: [">=8"]

  # The mcpb CLI that packs the .mcpb bundle, pinned with its own lockfile
  # (tools/mcpb/package-lock.json) so the package's audit stays its own.
  - package-ecosystem: "npm"
    directory: "/tools/mcpb"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(mcpb)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    groups:
      actions:
        patterns: ["*"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
