name: Release

# One tag, one release: `mcp-v<version>` on a commit of main (made by
# `node scripts/release.mjs`, merged through a PR) publishes that version to
# npm and the MCP Registry, and attaches the Claude Desktop bundles to a
# GitHub release.
#
# Only `publish` holds the OIDC publish identity (id-token: write). It runs no
# dependency install, no build and no repository script: it publishes the exact
# tarball `verify` packed (checked by SHA-256) and `install-smoke` installed on
# every OS (audit 6.2.5 E-4, E-7).
#
# workflow_dispatch is a dry run on any ref: verify, pack, install smoke and
# bundles, without the tag checks, and with no publish or release job.
on:
  push:
    tags:
      - "mcp-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: pnpm test

      - run: pnpm run check

      - run: pnpm run contract

      - name: The tag names the version every manifest declares
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/mcp-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          SERVER_VERSION=$(node -p "require('./server.json').version")
          if [ "$PKG_VERSION" != "$TAG_VERSION" ] || [ "$SERVER_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag mcp-v$TAG_VERSION, package.json $PKG_VERSION, server.json $SERVER_VERSION"
            exit 1
          fi
          # manifest-versions.test.ts (run above) holds the other manifests to package.json.

      - name: The tagged commit is on main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags --depth=200 origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_SHA is not on main. Release from a merged commit."
            exit 1
          }

      # The release artifact, packed from the build tested above, in this job
      # (no id-token). `publish` publishes this file and nothing else.
      - name: Pack the npm tarball
        id: pack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tarball"
          npm pack --pack-destination "$RUNNER_TEMP/tarball"
          cd "$RUNNER_TEMP/tarball"
          [ "$(ls ./*.tgz | wc -l)" = 1 ] || { echo "::error::expected one tarball: $(ls)"; exit 1; }
          TGZ=$(basename ./*.tgz)
          PKG_VERSION=$(node -p "require(process.env.GITHUB_WORKSPACE + '/package.json').version")
          TGZ_VERSION=$(tar -xzOf "$TGZ" package/package.json | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8")).version)')
          [ "$TGZ_VERSION" = "$PKG_VERSION" ] || { echo "::error::$TGZ holds $TGZ_VERSION, package.json says $PKG_VERSION"; exit 1; }
          SHA256=$(sha256sum "$TGZ" | cut -d' ' -f1)
          echo "$TGZ sha256 $SHA256"
          echo "tarball=$TGZ" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/tarball/*.tgz
          if-no-files-found: error

  # The tarball as a user installs it, before anyone can approve its publish:
  # each OS, npm 10 (Node 22's own) and npm 12 (no install scripts), in a
  # scratch project with a scratch HOME (scripts/smoke-installed.mjs).
  install-smoke:
    name: Install smoke (${{ matrix.os }}, npm ${{ matrix.npm }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        npm: ["10", "12"]
        include:
          - npm: "10"
            npm-install: bundled
          - npm: "12"
            npm-install: "12.2.1"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/proj

      - name: Use npm ${{ matrix.npm-install }}
        if: matrix.npm-install != 'bundled'
        shell: bash
        run: npm install -g --no-audit --no-fund "npm@${{ matrix.npm-install }}"

      - name: Install the verified tarball in a scratch project, smoke it
        shell: bash
        env:
          TGZ: ${{ needs.verify.outputs.tarball }}
          SHA256: ${{ needs.verify.outputs.sha256 }}
          NPM_MAJOR: ${{ matrix.npm }}
        run: |
          set -euo pipefail
          echo "node $(node --version), npm $(npm --version)"
          [ "$(npm --version | cut -d. -f1)" = "$NPM_MAJOR" ] || { echo "::error::expected npm $NPM_MAJOR"; exit 1; }
          cd "$RUNNER_TEMP/proj"
          # node, not sha256sum: macOS runners do not ship GNU coreutils.
          node -e '
            const got = require("crypto").createHash("sha256").update(require("fs").readFileSync(process.env.TGZ)).digest("hex");
            if (got !== process.env.SHA256) { console.error(`::error::${process.env.TGZ} sha256 ${got}, verify packed ${process.env.SHA256}`); process.exit(1); }
            console.log(`${process.env.TGZ}: sha256 OK`);
          '
          echo '{"name":"smoke","private":true}' > package.json
          npm install --no-audit --no-fund "./$TGZ"
          npm ls --all --omit=dev || true
          node "$GITHUB_WORKSPACE/scripts/smoke-installed.mjs" .

  bundles:
    name: Bundle (${{ matrix.label }})
    needs: verify
    # Claude Desktop runs on macOS and Windows; better-sqlite3 ships
    # per-platform prebuilds, so each OS/arch gets its own bundle, built there.
    strategy:
      matrix:
        include:
          - { os: windows-latest, label: win32-x64 }
          - { os: macos-latest, label: darwin-arm64 }
          - { os: macos-15-intel, label: darwin-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      # Production node_modules from pnpm-lock.yaml, the mcpb CLI from
      # tools/mcpb's lockfile (audit 6.2.5 E-6).
      - name: Build the .mcpb bundle
        run: node scripts/build-mcpb.mjs

      - name: Smoke the bundled server
        run: node scripts/smoke-installed.mjs --bundle dist-mcpb/stage/server

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: mcpb-${{ matrix.label }}
          path: dist-mcpb/*.mcpb
          if-no-files-found: error

  publish:
    name: Publish to npm and the MCP Registry
    needs: [verify, install-smoke, bundles]
    # Tag pushes only: a workflow_dispatch dry run ends before this job.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mcp-v')
    runs-on: ubuntu-latest
    timeout-minutes: 35  # the provenance wait alone can take 10 (audit 6.2.5 E-3)
    # npm publishes are irreversible. The `release` environment waits for a
    # maintainer's approval and admits only `mcp-v*` tags, so a tag pushed by
    # mistake, or by an automated agent with push rights, waits for a human.
    environment: release
    permissions:
      contents: read
      id-token: write
    # Nothing here installs the package's dependencies, builds, or runs a
    # repository script while the OIDC identity is in reach. The checkout is
    # read for the version and server.json (MCP Registry) only.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          # No registry-url: that input writes an .npmrc that points auth at
          # NODE_AUTH_TOKEN. This workflow publishes without a token.
          # No cache: nothing is installed from the lockfile in this job.

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/tarball

      # The file is the one verify packed and install-smoke installed: the same
      # SHA-256 (verify's job output, not a file carried in the artifact), and
      # the version the tag names.
      - name: Check the tarball against verify's SHA-256 and the tag
        env:
          TGZ: ${{ needs.verify.outputs.tarball }}
          SHA256: ${{ needs.verify.outputs.sha256 }}
        run: |
          set -euo pipefail
          [ -n "$TGZ" ] && [ -n "$SHA256" ] || { echo "::error::verify produced no tarball name or SHA-256; re-run all jobs"; exit 1; }
          cd "$RUNNER_TEMP/tarball"
          echo "$SHA256  $TGZ" | sha256sum -c -
          TAG_VERSION="${GITHUB_REF#refs/tags/mcp-v}"
          TGZ_VERSION=$(tar -xzOf "$TGZ" package/package.json | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8")).version)')
          [ "$TGZ_VERSION" = "$TAG_VERSION" ] || { echo "::error::$TGZ holds $TGZ_VERSION, the tag says $TAG_VERSION"; exit 1; }

      # npm TRUSTED PUBLISHING (OIDC). No token exists: the package's
      # publishing access is "require 2FA and disallow tokens", so this job is
      # the only automated route to npm. One-time setup on npmjs.com, package
      # @4da/mcp-server -> Settings -> Trusted Publisher -> GitHub Actions:
      # organization 4DA-Systems, repository 4da-mcp-server, workflow
      # release.yml, environment release. OIDC needs npm >= 11.5.1 (Node 22
      # bundles npm 10) and `id-token: write`, which this job has.
      #
      # Idempotent: when the version is already on npm (a re-run after the
      # registry step failed), the publish is skipped and the rest proceeds.
      #
      # It publishes the verified tarball, not the checkout: `npm publish <tgz>`
      # with --ignore-scripts runs no lifecycle script (prepublishOnly builds).
      # On a re-run over a live version it compares the registry's integrity
      # with this tarball, and warns if they differ.
      - name: Publish to npm (trusted publishing; skipped if the version is live)
        id: npm_publish
        env:
          TGZ: ${{ needs.verify.outputs.tarball }}
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./package.json').version")
          TGZ_PATH="$RUNNER_TEMP/tarball/$TGZ"
          if npm view "@4da/mcp-server@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "@4da/mcp-server@$PKG_VERSION is already on npm; skipping the publish."
            LIVE=$(npm view "@4da/mcp-server@$PKG_VERSION" dist.integrity)
            OURS="sha512-$(openssl dgst -sha512 -binary "$TGZ_PATH" | base64 -w0)"
            if [ "$LIVE" != "$OURS" ]; then
              echo "::warning::the live $PKG_VERSION tarball ($LIVE) is not this run's tarball ($OURS)"
            fi
          else
            # Exact pin, no install scripts: this job holds the OIDC publish
            # identity (audit 6.2.5 E-4). OIDC needs npm >= 11.5.1.
            npm install -g --ignore-scripts --no-audit --no-fund npm@11.21.0
            npm --version
            npm publish "$TGZ_PATH" --access public --ignore-scripts
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # A version published here must carry what trusted publishing promises:
      # a SLSA provenance attestation and a trusted-publisher identity. The
      # server's own dependency_check (and pnpm's trustPolicy) read a release
      # without them, after releases that had them, as a trust DOWNGRADE, so a
      # silently unattested publish would make our own tool flag us.
      #
      # It runs on every run, not only the one that published: the documented fix for a failed
      # registry step is `gh run rerun --failed`, which skips the publish, and a run that skipped
      # this check could finish green over an unattested version (audit 6.2.5 E-3). npm can take
      # minutes to show the attestation (6.1.0 timed out at 150 s), so it waits up to 10 minutes.
      - name: Verify provenance and the trusted-publisher identity
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 40); do
            PRED=$(npm view "@4da/mcp-server@$PKG_VERSION" dist.attestations.provenance.predicateType 2>/dev/null || true)
            TP=$(npm view "@4da/mcp-server@$PKG_VERSION" _npmUser.trustedPublisher.id 2>/dev/null || true)
            if [ -n "$PRED" ] && [ -n "$TP" ]; then
              echo "provenance: $PRED | trusted publisher: $TP"
              exit 0
            fi
            echo "attempt $attempt: provenance='$PRED' trustedPublisher='$TP'; waiting for the registry"
            sleep 15
          done
          echo "::error::@4da/mcp-server@$PKG_VERSION was published without provenance or a trusted-publisher identity. Check the npm Trusted Publisher configuration (repository 4DA-Systems/4da-mcp-server, workflow release.yml, environment release)."
          exit 1

      - name: Install mcp-publisher (version-pinned, SHA-256 verified)
        # It runs with this job's OIDC identity, so it is pinned to a release
        # and checked against the upstream checksum file. Refresh VERSION and
        # SHA together, from registry_<version>_checksums.txt on the release page.
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          ASSET="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL -o "$ASSET" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${ASSET}"
          echo "${MCP_PUBLISHER_SHA256}  ${ASSET}" | sha256sum -c -
          tar xzf "$ASSET" mcp-publisher
          rm -f "$ASSET"

      # The registry name io.github.4DA-Systems/* is granted to any repository
      # of the 4DA-Systems organisation (the OIDC token's repository_owner).
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  github-release:
    name: GitHub release with the bundles
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: bundles
          pattern: mcpb-*
          merge-multiple: true

      - name: Create the release (notes from CHANGELOG.md)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#mcp-v}"
          # The changelog section for this version, without its heading.
          awk -v v="$VERSION" '
            $0 ~ "^## " v " " { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ---
          npm: https://www.npmjs.com/package/@4da/mcp-server/v/${VERSION}
          Claude Desktop: download the .mcpb for your platform below, then Settings -> Extensions -> Install from file.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" bundles/*.mcpb --clobber
          else
            gh release create "$TAG" bundles/*.mcpb --verify-tag --title "@4da/mcp-server ${VERSION}" --notes-file notes.md --latest
          fi
